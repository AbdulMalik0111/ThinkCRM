<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoDotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#06B6D4" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Brand Mark Squircle -->
  <g transform="translate(4, 4)">
    <rect width="48" height="48" rx="12" fill="url(#logoBgGrad)" stroke="#1E293B" stroke-width="1.5" />
    <!-- T Lettermark -->
    <path d="M 14 13 L 34 13 L 34 18 L 26.5 18 L 26.5 35 L 21.5 35 L 21.5 18 L 14 18 Z" fill="#FFFFFF" />
    <!-- Glowing Brand Dot -->
    <circle cx="32" cy="32" r="3" fill="url(#logoDotGrad)" filter="url(#logoGlow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(62, 10)">
    <!-- "ThinkTive" -->
    <text x="0" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="currentColor" letter-spacing="-0.3">
      ThinkTive<tspan fill="#06B6D4" font-weight="800">.</tspan>
    </text>
    <!-- "IT Solution" -->
    <text x="1" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="2">
      IT SOLUTION
    </text>
  </g>
</svg>
