<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; padding: 30px; background: #e2e8f0; }
    .box { padding: 30px; margin: 20px 0; border-radius: 12px; }
    .dark-box { background: #1e293b; color: white; }
    .light-box { background: #ffffff; color: black; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    img { height: 40px; width: auto; object-fit: contain; }
    .invert { filter: invert(1); }
  </style>
</head>
<body>
  <h2>Logo Visibility Test</h2>

  <div class="box light-box">
    <h4>1. Light Background (Login Card / Light Sidebar / Light Header) - Default:</h4>
    <img src="/logo.webp" alt="ThinkTive" />
  </div>

  <div class="box dark-box">
    <h4>2. Dark Background (#1e293b - Dark Theme / Semi-dark Sidebar) with filter: invert(1):</h4>
    <img src="/logo.webp" alt="ThinkTive" class="invert" />
  </div>
</body>
</html>
